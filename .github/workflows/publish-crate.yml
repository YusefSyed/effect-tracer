name: publish-crate
# Publishes a tagged version to crates.io. Run by hand from the Actions tab.
# With "publish" left off it only packages and builds the crate (a dry run),
# which needs no token. The real upload uses crates.io Trusted Publishing: the job
# trades GitHub's OIDC token for a short-lived crates.io token, so no secret is stored.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish"
        default: "v0.1.2"
        required: true
      publish:
        description: "Upload to crates.io (off = dry run only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$v" = "${{ inputs.ref }}" || { echo "tag ${{ inputs.ref }} != crate version $v"; exit 1; }
      - name: List the packaged files
        run: cargo package --locked --list
      - name: Dry run (package and build)
        run: cargo publish --locked --dry-run
      - name: Get a short-lived crates.io token
        if: ${{ inputs.publish }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: ${{ inputs.publish }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
